<style>

<script>
(function(){

};
var HORA_INICIAL=(['manana','mediodia','dorada'].indexOf(qs.get('hora'))>=0)?qs.get('hora'):'dorada';

  did:{t:'Didáctico',c:'b-did'},pra:{t:'Práctica agroecológica',c:'b-pra'}
};
var GUION=[
 {w:'tecno',t:'David, te desafío a un debate. Yo digo que la agricultura convencional alimenta al país y cuida el suelo. Argentina llegó a un récord de unos 140 millones de toneladas de granos en la campaña 2018 y 2019. Eso no sale de una huerta.'},
 {w:'david',t:'Producir mucho no es lo mismo que cuidar. Un especialista del INTA advirtió que la siembra directa con monocultivo de soja atenta contra la sustentabilidad. Yo cubro el suelo, roto los cultivos por familias y lo mantengo vivo.'},
 {w:'tecno',pt:'david',t:'Eso te lo anoto: punto para vos. Por eso se recomienda rotar con maíz, trigo o sorgo. Pero fijate lo que logramos. La siembra directa pasó de 0,4% del área en 1989 y 1990 a 80,6% hoy, según Aapresid. Es suelo cubierto, sin arar.'},
 {w:'david',pt:'tecno',t:'Eso lo reconozco, punto para vos. Cubrir el suelo es algo que compartimos. Pero vamos al glifosato: ¿no te preocupa depender de un herbicida?'},
 {w:'tecno',t:'Es un tema delicado y no te voy a mentir. En 2015 la IARC lo clasificó como probablemente cancerígeno, y la EFSA, la EPA y la ECHA concluyeron que no hay evidencia suficiente. No es ni veneno seguro ni prueba cerrada: discrepan en qué evalúan.'},
 {w:'david',t:'Justamente por eso prefiero prevenir. Una plaga es una señal de desequilibrio. Atraigo mariquitas y crisopas con flores, y solo intervengo si el daño supera lo tolerable. Menos dependencia, menos riesgo.'},
 {w:'tecno',t:'Pregunta honesta, David: eso, ¿funciona en miles de hectáreas, como en el Chaco o en Formosa?'},
 {w:'david',t:'En la huerta me funciona. Para lotes enormes no tengo datos, y no te voy a inventar nada. Eso lo tendría que decir un técnico del INTA.'},
 {w:'tecno',t:'Y acá pesa el contexto. Un productor de El Colorado cuenta que hace quince o veinte años había cincuenta a sesenta mil hectáreas de algodón y que hoy predomina la ganadería. Clima difícil y más de mil kilómetros hasta los puertos del Paraná. Es un testimonio, no una estadística.'},
 {w:'david',t:'Por eso en el subtrópico trabajo con la temporada fresca, de abril a agosto, para hojas y repollos. El calor extremo pide sombra y riego. Árboles y cobertura del suelo ayudan mucho.'},
 {w:'tecno',t:'Sobre la seguridad de aplicar, el INTA y las normas oficiales sostienen que con buenas prácticas el riesgo es bajo: equipo registrado, clima adecuado, zonas de resguardo y receta de un profesional.'},
 {w:'david',pt:'tecno',t:'Ahí no tengo un dato para refutarte. Lo oficial dice riesgo bajo con buenas prácticas, aunque hay críticos que dicen que las distancias a escuelas y pueblos no alcanzan. Punto para vos.'},
 {w:'tecno',pt:'david',t:'Y te concedo algo incómodo. Entre 2002 y 2018, el Censo Nacional Agropecuario pasó de 333 mil a 250 mil explotaciones, unas 82 mil menos, y las sociedades son el 11% de las explotaciones pero el 38% de la superficie. No digo que sea solo culpa de la agricultura convencional, pero es un costo real. Punto para vos.'},
 {w:'david',t:'Entonces quedamos parejos. Yo gano en cuidar el suelo con diversidad y en depender menos de insumos. Vos ganás en escala y en datos.'},
 {w:'tecno',t:'De acuerdo en lo central. Suelo cubierto, rotación y aplicar con buenas prácticas. No hay un único ganador: decidí vos, que nos escuchaste.'}
];

/* ================= Utilidades de color y azar ================= */
function hex(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function mixc(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function css(a,al){return al==null?'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')':'rgba('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+','+al+')'}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ================= Horas del día ================= */
var HORAS={
  manana:{etq:'08:00',cielo:['#6fa6e0','#b9d8ee','#f6edcf'],haze:'#efe6c8',mul:[1,0.99,0.93],hazeD:90,
    sol:{x:330,y:372,r:30,glow:.55,col:[255,244,200]},sombra:{dx:1,len:.9},tinte:'rgba(255,238,200,0.05)',viñeta:.18,nube:[255,255,255],nubeSombra:[200,214,230],pajaros:true},
  mediodia:{etq:'12:30',cielo:['#4f98e0','#a9d0ee','#dcecf2'],haze:'#d6e6ec',mul:[1,1,1],hazeD:110,
    sol:null,sombra:{dx:.15,len:.22},tinte:'rgba(255,255,255,0.0)',viñeta:.1,nube:[255,255,255],nubeSombra:[196,214,232],pajaros:true},
  dorada:{etq:'18:30',cielo:['#5d79b8','#e9a77f','#f9d9a0'],haze:'#f3cf9c',mul:[1.06,0.9,0.72],hazeD:60,
    sol:{x:1330,y:392,r:44,glow:.95,col:[255,205,120]},sombra:{dx:-1,len:1.9},tinte:'rgba(255,150,70,0.10)',viñeta:.34,nube:[255,196,150],nubeSombra:[150,110,130],pajaros:true}
};
var horaActual=HORA_INICIAL, T=HORAS[horaActual];
T.hazeC=hex(T.haze);

/* ================= Geometría de la escena (espacio virtual) ================= */
var HZ=430,F=1000,CH=1.6,CX=800;
function PX(X,Z){return CX+X*F/Z}
function PY(Z){return HZ+CH*F/Z}
function SC(Z){return F/Z}
function col(h,Z){var c=hex(h);c=[Math.min(255,c[0]*T.mul[0]),Math.min(255,c[1]*T.mul[1]),Math.min(255,c[2]*T.mul[2])];
  var f=Z?Math.min(.88,1-Math.exp(-Z/T.hazeD)):0;return css(mixc(c,T.hazeC,f))}
function lit(h){return col(h,0)}

/* ================= Lienzo y vista ================= */
var cv=$('escena'),ctx=cv.getContext('2d');
var view={w:0,h:0,dpr:1,s:1,ox:0,oy:0,x0:0,x1:1600,y0:0,y1:900};
var bgSky=document.createElement('canvas'),bgLand=document.createElement('canvas');
var bgListo=false;

function medirPanel(){var p=$('panel');return p?p.getBoundingClientRect().height+14:0}
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2),w=window.innerWidth,h=window.innerHeight;
  view.dpr=dpr;view.w=w;view.h=h;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var ph=medirPanel(),area=Math.max(160,h-ph);
  // rectángulo seguro: personajes + etiquetas (virtual 380..1220 x 330..870)
  var s=Math.min(w/(w<600?740:900),area/540);
  s=Math.max(.3,Math.min(1.7,s));
  view.s=s;
  view.ox=w/2-800*s;
  view.oy=area/2-600*s;
  view.x0=-view.ox/s;view.x1=(w-view.ox)/s;view.y0=-view.oy/s;view.y1=(h-view.oy)/s;
  for(var c of [bgSky,bgLand]){c.width=cv.width;c.height=cv.height}
  bgListo=false;
}
function aplicarVista(g){g.setTransform(view.s*view.dpr,0,0,view.s*view.dpr,view.ox*view.dpr,view.oy*view.dpr)}

/* ================= Fondo: cielo ================= */
function dibujarCielo(){
  var g=bgSky.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,bgSky.width,bgSky.height);
  aplicarVista(g);
  var gr=g.createLinearGradient(0,view.y0-100,0,HZ+4);
  gr.addColorStop(0,T.cielo[0]);gr.addColorStop(.62,T.cielo[1]);gr.addColorStop(1,T.cielo[2]);
  g.fillStyle=gr;g.fillRect(view.x0-50,view.y0-120,view.x1-view.x0+100,HZ-view.y0+130);

    gl.addColorStop(0,css(s.col,s.glow));gl.addColorStop(.18,css(s.col,s.glow*.45));gl.addColorStop(1,css(s.col,0));
    g.fillStyle=gl;g.fillRect(s.x-600,s.y-600,1200,1200);
    g.fillStyle=css(mixc(s.col,[255,255,255],.55),.98);g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();
  }
}

/* ================= Fondo: tierra, cultivos, monte ================= */
function tuft(g,x,y,s,c1,c2,R){
  var n=3;for(var i=0;i<n;i++){var a=(i-1)*.45+(R()-.5)*.2;
    g.fillStyle=i===1?c2:c1;g.beginPath();g.ellipse(x+Math.sin(a)*s*.25,y-s*.45,s*.11,s*.5,a,0,7);g.fill();}
}
function arbolMonte(g,X,Z,alto,ancho,col1,col2){
  var sc=SC(Z),by=PY(Z),bx=PX(X,Z),h=alto*sc,w=ancho*sc;
  g.strokeStyle=col('#4a3a2a',Z);g.lineWidth=Math.max(1,.28*sc);g.lineCap='round';
  g.beginPath();g.moveTo(bx,by);g.lineTo(bx+w*.05,by-h*.7);g.stroke();
  g.fillStyle=col(col1,Z);g.beginPath();g.ellipse(bx+w*.05,by-h*.78,w,h*.28,0,0,7);g.fill();
  g.fillStyle=col(col2,Z);g.beginPath();g.ellipse(bx-w*.2,by-h*.86,w*.62,h*.2,0,0,7);g.fill();
  g.beginPath();g.ellipse(bx+w*.45,by-h*.74,w*.5,h*.17,0,0,7);g.fill();
}
function palmera(g,X,Z,alto){
  var sc=SC(Z),by=PY(Z),bx=PX(X,Z),h=alto*sc;
  g.strokeStyle=col('#6a5a40',Z);g.lineWidth=Math.max(1,.22*sc);g.lineCap='round';
  g.beginPath();g.moveTo(bx,by);g.quadraticCurveTo(bx+h*.04,by-h*.5,bx+h*.02,by-h);g.stroke();
  var tx=bx+h*.02,ty=by-h;g.strokeStyle=col('#3c5f2a',Z);g.lineWidth=Math.max(1,.12*sc);
  for(var i=0;i<9;i++){var a=-Math.PI+(i/8)*Math.PI;
    g.beginPath();g.moveTo(tx,ty);g.quadraticCurveTo(tx+Math.cos(a)*h*.26,ty+Math.sin(a)*h*.26-h*.06,tx+Math.cos(a)*h*.42,ty+Math.sin(a)*h*.3+h*.1);g.stroke();}
}
function cartel(g,X,Z,texto,colorTabla){
  var sc=SC(Z),bx=PX(X,Z),by=PY(Z);
  g.fillStyle=col('#6b4a2c',Z);g.fillRect(bx-.05*sc-.3*sc,by-1.25*sc,.1*sc,1.25*sc);g.fillRect(bx+.3*sc-.05*sc,by-1.25*sc,.1*sc,1.25*sc);
  rr(g,bx-.62*sc,by-1.4*sc,1.24*sc,.5*sc,.04*sc);g.fillStyle=col(colorTabla,Z);g.fill();
  g.lineWidth=Math.max(1,.03*sc);g.strokeStyle=col('#4a3320',Z);g.stroke();
  g.fillStyle=col('#fff8e4',Z);g.font='700 '+(.18*sc).toFixed(1)+'px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText(texto,bx,by-1.15*sc);
}
function dibujarTierra(){
  var g=bgLand.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,bgLand.width,bgLand.height);
  aplicarVista(g);
  var R=rng(20261024);
  var xa=view.x0-100,xb=view.x1+100,yb=view.y1+80;
  // monte lejano (capas)
  for(var capa=0;capa<3;capa++){
    var Zc=[190,130,85][capa];
    for(var X=-260;X<260;X+=2.6+R()*3){
      if(R()<.12){palmera(g,X,Zc+R()*10,(6+R()*3.5));}
      else arbolMonte(g,X,Zc+R()*14,3.5+R()*3.5,2.2+R()*2.8,capa===0?'#5c7a4a':'#48703a',capa===0?'#6a8a54':'#58804a');
    }
  }
  // suelo
  var gr=g.createLinearGradient(0,HZ,0,yb);
  gr.addColorStop(0,col('#9aa56a',200));gr.addColorStop(.3,col('#8d9a55',30));gr.addColorStop(1,col('#6f6a3a',3));
  g.fillStyle=gr;g.fillRect(xa,HZ+2,xb-xa,yb-HZ);
  var Zmax=260,Zn=1.15;
  function bandaX(X0,X1,color,Z0,Z1){g.fillStyle=color;g.beginPath();
    g.moveTo(PX(X0,Z0),PY(Z0));g.lineTo(PX(X1,Z0),PY(Z0));g.lineTo(PX(X1,Z1),PY(Z1));g.lineTo(PX(X0,Z1),PY(Z1));g.closePath();g.fill()}
  // lote agroecológico: suelo oscuro con paja
  bandaX(-420,-2.2,col('#5d4630',30),Zmax,Zn);
  // lote convencional: rastrojo (siembra directa)
  bandaX(2.2,420,col('#a99a6c',30),Zmax,Zn);
  // camino de tierra colorada
  var cg=g.createLinearGradient(0,HZ,0,yb);cg.addColorStop(0,col('#b86b46',200));cg.addColorStop(.4,col('#a9532f',20));cg.addColorStop(1,col('#8f3f22',2));

  elipse(g,-37,hy+4,6,11,skinD);elipse(g,37,hy+4,6,11,skinD);
  elipse(g,0,hy,37,46,skin);
  if(esD){
    // pelo oscuro con mechón gris y barba gris
    g.fillStyle=lit('#2f2c2a');g.beginPath();g.moveTo(-38,hy-6);g.quadraticCurveTo(-40,hy-52,0,hy-50);g.quadraticCurveTo(40,hy-52,38,hy-6);g.quadraticCurveTo(30,hy-28,0,hy-30);g.quadraticCurveTo(-30,hy-28,-38,hy-6);g.fill();
    g.fillStyle=lit('#77736e');g.beginPath();g.ellipse(12,hy-42,16,5,.2,0,7);g.fill();g.beginPath();g.ellipse(-37,hy-10,5,14,0,0,7);g.fill();g.beginPath();g.ellipse(37,hy-10,5,14,0,0,7);g.fill();
    g.fillStyle=lit('#8f8a84');g.beginPath();g.moveTo(-37,hy+4);g.quadraticCurveTo(-34,hy+46,0,hy+50);g.quadraticCurveTo(34,hy+46,37,hy+4);g.quadraticCurveTo(26,hy+12,0,hy+14);g.quadraticCurveTo(-26,hy+12,-37,hy+4);g.fill();
  }else{
    g.fillStyle='rgba(70,45,30,.22)';g.beginPath();g.moveTo(-36,hy+6);g.quadraticCurveTo(-30,hy+44,0,hy+46);g.quadraticCurveTo(30,hy+44,36,hy+6);g.quadraticCurveTo(24,hy+16,0,hy+17);g.quadraticCurveTo(-24,hy+16,-36,hy+6);g.fill();
    // gorro
    g.fillStyle=lit('#2d2d31');g.beginPath();g.moveTo(-40,hy-14);g.quadraticCurveTo(-44,hy-62,0,hy-64);g.quadraticCurveTo(44,hy-62,40,hy-14);g.quadraticCurveTo(0,hy-26,-40,hy-14);g.fill();
    g.fillStyle=lit('#3b3b40');g.beginPath();g.moveTo(-41,hy-16);g.quadraticCurveTo(0,hy-28,41,hy-16);g.lineTo(40,hy-4);g.quadraticCurveTo(0,hy-16,-40,hy-4);g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1.5;for(var r=-30;r<=30;r+=8){g.beginPath();g.moveTo(r,hy-58);g.lineTo(r*1.03,hy-8);g.stroke()}
  }
  // cejas
  var cj=p.ceja*4;g.strokeStyle=esD?'#34322f':'#4a3a2c';g.lineWidth=3.4;g.lineCap='round';
  g.beginPath();g.moveTo(-23,hy-12-cj);g.lineTo(-8,hy-14-cj);g.moveTo(8,hy-14-cj);g.lineTo(23,hy-12-cj);g.stroke();
  // ojos
  var ap=Math.max(.08,1-Math.sin(Math.min(1,p.blink)*Math.PI)*.95);
  var mirarX=p.hablando?0:inn*2.6;
  for(var s=-1;s<=1;s+=2){
    var ex=s*15,ey=hy-2;
    g.fillStyle='#f3efe6';g.beginPath();g.ellipse(ex,ey,8.5,6.4*ap,0,0,7);g.fill();
    g.fillStyle=esD?'#4a2c17':'#3a5a6a';g.beginPath();g.ellipse(ex+mirarX,ey,4,4*ap,0,0,7);g.fill();
    g.fillStyle='#0b0806';g.beginPath();g.ellipse(ex+mirarX,ey,2,2*ap,0,0,7);g.fill();
  }
  // nariz
  g.strokeStyle=esD?'rgba(120,70,45,.7)':'rgba(150,100,75,.7)';g.lineWidth=2.4;g.beginPath();g.moveTo(-1,hy+4);g.quadraticCurveTo(-7,hy+16,0,hy+17);g.quadraticCurveTo(6,hy+16,2,hy+4);g.stroke();
  // bigote (David)
  if(esD){g.fillStyle=lit('#7b7772');g.beginPath();g.ellipse(0,hy+24,16,4.2,0,0,7);g.fill()}
  // boca
  var o=p.mouth.o,mw=14*p.mouth.w,my=hy+31;

    g.strokeStyle=esD?'#8a4e44':'#9a5a50';g.lineWidth=3;g.beginPath();g.moveTo(-mw,my);g.quadraticCurveTo(0,my+4+(p.hablando?0:2),mw,my);g.stroke();
  }else{
    g.fillStyle='#3a1512';g.beginPath();g.ellipse(0,my+o*3,mw,2.5+o*9,0,0,7);g.fill();
    if(o>.14){g.fillStyle='#f2eee4';g.beginPath();g.ellipse(0,my+o*3-(2.5+o*9)*.55,mw*.78,2.2,0,0,7);g.fill()}
    g.strokeStyle=esD?'#8a4e44':'#9a5a50';g.lineWidth=2.4;g.beginPath();g.ellipse(0,my+o*3,mw+1,3+o*9,0,0,7);g.stroke();
  }
  g.restore(); // cabeza
  g.restore();

function holograma(g,hx,hy,inn,a,t){
  var cx=hx+inn*46,cy=hy-86+Math.sin(t*2)*3;
  g.save();g.globalAlpha=a;
  g.strokeStyle='rgba(120,240,255,.7)';g.lineWidth=1.2;g.setLineDash([3,4]);g.beginPath();g.moveTo(hx,hy-8);g.lineTo(cx-inn*20,cy+44);g.stroke();g.setLineDash([]);
  g.shadowColor='#45e8ff';g.shadowBlur=14;
  g.fillStyle='rgba(40,200,230,.16)';rr(g,cx-62,cy-44,124,88,10);g.fill();g.strokeStyle='rgba(120,240,255,.95)';g.lineWidth=1.6;g.stroke();
  g.shadowBlur=6;g.lineWidth=1.7;g.lineCap='round';g.strokeStyle='rgba(150,245,255,.98)';
  // hoja
  g.beginPath();g.ellipse(cx-28,cy-18,9,15,-.6,0,7);g.stroke();g.beginPath();g.moveTo(cx-34,cy-8);g.lineTo(cx-22,cy-28);g.stroke();
  // tractor
  g.strokeRect(cx+14,cy-24,24,10);g.strokeRect(cx+18,cy-34,10,10);g.beginPath();g.arc(cx+18,cy-10,7,0,7);g.stroke();g.beginPath();g.arc(cx+36,cy-8,4,0,7);g.stroke();
  // trigo
  g.beginPath();g.moveTo(cx-28,cy+36);g.lineTo(cx-28,cy+8);g.stroke();for(var k=0;k<3;k++){g.beginPath();g.ellipse(cx-34,cy+14+k*8,3,5,-.6,0,7);g.stroke();g.beginPath();g.ellipse(cx-22,cy+14+k*8,3,5,.6,0,7);g.stroke();}
  // gota
  g.beginPath();g.moveTo(cx+26,cy+8);g.quadraticCurveTo(cx+38,cy+24,cx+26,cy+34);g.quadraticCurveTo(cx+14,cy+24,cx+26,cy+8);g.stroke();
  g.restore();
}

function etiqueta(g,p,t,activo){
  var esD=p.id==='david',txt=(view.w<600?(esD?'David':'Tecno'):(esD?'David · Agroecología':'Tecno · Agricultura convencional'))+(estado.modo==='debate'||$('voto').hidden===false?'  ·  '+p.pts:'');
  g.save();g.font='700 17px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  var w=g.measureText(txt).width+28,x=p.x,y=p.y-418-(activo?4:0);
  rr(g,x-w/2,y-16,w,32,16);
  g.fillStyle=activo?'rgba(255,250,232,.97)':'rgba(255,250,232,.80)';g.fill();
  g.lineWidth=activo?3.5:1.5;g.strokeStyle=esD?'#3f6b2a':'#1b8fa6';g.stroke();
  g.fillStyle='#2b2218';g.fillText(txt,x,y+1);
  if(activo){for(var i=0;i<3;i++){g.fillStyle=esD?'#3f6b2a':'#1b8fa6';g.beginPath();g.arc(x-10+i*10,y+26+Math.sin(t*8+i)*3,3.2,0,7);g.fill()}}
  g.restore();
}

/* ================= Voz del navegador y debate ================= */
var vocesEs=[];
function cargarVoces(){if(!window.speechSynthesis)return;var l=speechSynthesis.getVoices()||[];
  vocesEs=l.filter(function(v){return /^es/i.test(v.lang.replace('_','-'))});
  var pr=function(v){var L=v.lang.replace('_','-');return /^es-AR/i.test(L)?0:/^es-(US|MX|419|CO|CL|UY)/i.test(L)?1:2};
  vocesEs.sort(function(a,b){return pr(a)-pr(b)})}
cargarVoces();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=cargarVoces;

var estado={modo:'idle',i:-1,token:0,watch:0};
var live=null,liveWho=null;
function setEstado(t){$('estado').textContent=t||''}
function tags(tag){var e=$('capTag');if(!tag){e.hidden=true;return}var d=TAGS[tag];e.textContent=d.t;e.className='badge '+d.c;e.hidden=false}
function mostrar(who,tag,texto){var e=$('sr');if(e)e.textContent=(who==='david'?'David: ':'Tecno: ')+texto}
function silenciar(){
  if(window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}
  ['david','tecno'].forEach(function(k){P[k].tl=null;P[k].hablando=false});
}
function hablar(who,texto,alTerminar){
  var p=P[who],token=++estado.token;silenciar();
  var palabras=texto.split(/\s+/).length,durSilencio=Math.max(2800,palabras*390);
  var datos=null,iniciado=false,terminado=false;
  function fin(){if(terminado||token!==estado.token)return;terminado=true;clearTimeout(estado.watch);p.tl=null;p.hablando=false;alTerminar&&alTerminar()}
  function ir(chMs){if(iniciado||token!==estado.token)return;iniciado=true;datos=lineaTiempo(texto,chMs);p.tl={items:datos.items,idx:0,total:datos.total,starts:datos.starts};p.t0=performance.now();p.hablando=true}
  var voz=null;
  if(vocesEs.length){voz=who==='tecno'&&vocesEs.length>1?vocesEs[1]:vocesEs[0]}
  if(window.speechSynthesis&&window.SpeechSynthesisUtterance&&voz){
    var u=new SpeechSynthesisUtterance(texto);u.voice=voz;u.lang=voz.lang;u.rate=who==='tecno'?1.04:.96;u.pitch=who==='tecno'?.78:1.02;
    u.onstart=function(){ir(64)};
    u.onboundary=function(ev){if(token!==estado.token)return;if(!iniciado)ir(64);if(p.tl&&typeof ev.charIndex==='number'&&p.tl.starts[ev.charIndex]!=null)p.t0=performance.now()-p.tl.starts[ev.charIndex]};
    u.onend=function(){setTimeout(fin,350)};u.onerror=function(){setTimeout(fin,200)};
    speechSynthesis.speak(u);setTimeout(function(){ir(64)},1200);
    estado.watch=setTimeout(fin,Math.max(12000,durSilencio*2.2));
    setEstado('Voz del dispositivo ('+voz.lang+').'+(vocesEs.length<2?' Este dispositivo tiene una sola voz en español: David y Tecno se distinguen por el tono.':''));
  }else{
    ir(durSilencio/(texto.length*1.1));
    estado.watch=setTimeout(fin,durSilencio);
    setEstado('Este dispositivo no tiene voz en español, así que el debate no se puede escuchar acá. Probá en otro navegador o hablá con cada uno por micrófono.');
  }
}
function jugarTurno(i){
  if(estado.modo!=='debate')return;
  if(i>=GUION.length){terminarDebate(true);return}
  estado.i=i;var t=GUION[i];mostrar(t.w,null,t.t);if(t.pt)P[t.pt].pts++;
  $('prog').textContent='Turno '+(i+1)+' de '+GUION.length;
  hablar(t.w,t.t,function(){if(estado.modo==='debate')setTimeout(function(){jugarTurno(i+1)},450)});
}
function iniciarDebate(){
  terminarLive();estado.modo='debate';silenciar();P.david.pts=0;P.tecno.pts=0;$('voto').hidden=true;
  $('bDebate').textContent='■ Detener el debate';$('bDebate').classList.add('on');
  jugarTurno(0);
}
function terminarDebate(completo){
  var estabaDebate=estado.modo==='debate';
  estado.modo='idle';estado.token++;clearTimeout(estado.watch);silenciar();
  $('bDebate').textContent='▶ Ver el debate';$('bDebate').classList.remove('on');
  $('prog').textContent='';
  if(completo){setEstado('Fin del debate: '+P.david.pts+' a '+P.tecno.pts+' en puntos concedidos.');$('voto').hidden=false}
  else if(estabaDebate){setEstado('')}
}

/* ================= Conversación en vivo (ElevenLabs) ================= */
function marcarLive(who,on){
  ['david','tecno'].forEach(function(k){var b=$(k==='david'?'bDavid':'bTecno');
    var activo=on&&who===k;b.classList.toggle('on',activo);
    b.textContent=activo?('Terminar con '+(k==='david'?'David':'Tecno')):('Hablar con '+(k==='david'?'David':'Tecno'))});
}
function terminarLive(){
  if(live){try{live.endSession()}catch(e){}}
  live=null;if(liveWho){P[liveWho].vivo=false;P[liveWho].hablando=false}liveWho=null;marcarLive(null,false);
  ['david','tecno'].forEach(function(k){P[k].tl=null});
}
async function iniciarLive(who){
  if(live&&liveWho===who){terminarLive();setEstado('Charla terminada.');return}
  terminarDebate(false);terminarLive();
  var btn=$(who==='david'?'bDavid':'bTecno');btn.disabled=true;
  setEstado('Conectando con '+(who==='david'?'David':'Tecno')+'…');
  try{
    var mod;
    try{mod=await import('https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm')}
    catch(e1){mod=await import('https://esm.sh/@elevenlabs/client@1.26.0')}
    await navigator.mediaDevices.getUserMedia({audio:true});
    liveWho=who;P[who].vivo=true;
    var nombre=who==='david'?'David':'Tecno';
    live=await mod.Conversation.startSession({
      agentId:AGENTES[who],connectionType:'websocket',
      onConnect:function(){setEstado('Conectado con '+nombre+'. Hablale con el micrófono.');mostrar(who,null,'Hablale con el micrófono.')},
      onDisconnect:function(){if(liveWho===who){live=null;P[who].vivo=false;P[who].hablando=false;liveWho=null;marcarLive(null,false);setEstado('Charla terminada.')}},
      onError:function(m){console.error(m);setEstado('Error de conexión con el agente.')},
      onMessage:function(m){if(m&&m.message)mostrar(m.source==='user'?'tecno':who,null,m.message)},
      onModeChange:function(m){var hablandoAhora=m&&m.mode==='speaking';P[who].hablando=hablandoAhora;if(!hablandoAhora)P[who].tl=null}
    });
    marcarLive(who,true);
  }catch(e){
    console.error(e);live=null;if(liveWho){P[liveWho].vivo=false}liveWho=null;marcarLive(null,false);
    setEstado('No se pudo iniciar la charla por voz. Necesita micrófono, conexión a internet y que la página esté publicada con https (por ejemplo en GitHub Pages).');
  }
  btn.disabled=false;
}

/* ================= Animación ================= */
function actualizarPersona(p,dt,t,otro){
  // boca
  var objetivo={o:0,w:1};
  if(p.tl){
    var tt=performance.now()-p.t0,its=p.tl.items;
    while(p.tl.idx<its.length&&its[p.tl.idx].e<tt)p.tl.idx++;
    if(p.tl.idx<its.length&&tt>=its[p.tl.idx].s){var v=VIS[its[p.tl.idx].v];objetivo={o:v.o,w:v.w}}
  }else if(p.vivo&&p.hablando&&live&&live.getOutputVolume){
    var vol=live.getOutputVolume()||0;objetivo={o:Math.min(1,vol*2.6),w:.8+Math.min(.6,vol)};
  }
  var k=1-Math.exp(-dt*(objetivo.o<p.mouth.o?24:32));
  p.mouth.o+=(objetivo.o-p.mouth.o)*k;p.mouth.w+=(objetivo.w-p.mouth.w)*k;
  p.energia+=((p.hablando?.35+p.mouth.o*.65:0)-p.energia)*(1-Math.exp(-dt*6));
  // gestos
  if(p.hablando&&!reduce){p.proximoGesto-=dt;if(p.proximoGesto<=0){p.gesto=GESTOS[p.gi++%GESTOS.length];p.proximoGesto=1.5+Math.random()*2;p.ceja=1}}
  else if(!p.hablando){p.gesto='rest'}
  var tp=POSES[p.gesto],ks=1-Math.exp(-dt*4.5),amp=p.hablando?.6+p.energia*.5:1;
  var base=POSES.rest;
  p.pose[0]+=((base[0]+(tp[0]-base[0])*Math.min(1,amp))-p.pose[0])*ks;
  p.pose[1]+=((base[1]+(tp[1]-base[1])*Math.min(1,amp))-p.pose[1])*ks;
  p.ceja=Math.max(0,p.ceja-dt*2);
  var holoObj=(p.id==='tecno'&&p.hablando&&(p.gesto==='palm'||p.gesto==='wide'||p.gesto==='raise'))?1:0;
  p.holo+=(holoObj-p.holo)*(1-Math.exp(-dt*5));
  // parpadeo y cabeza
  p.proxParp-=dt;if(p.proxParp<=0){p.blink=1;p.proxParp=2+Math.random()*3.5}
  if(p.blink>0)p.blink=Math.max(0,p.blink-dt*7);
  var escucha=otro.hablando&&!p.hablando;
  var tiltObj=(escucha?p.inner*.05:0)+(p.hablando?Math.sin(t*3.1)*.03*p.energia:0);
  p.tilt+=(tiltObj-p.tilt)*(1-Math.exp(-dt*5));
}

var reloj=performance.now(),tAcum=0;
function bucle(now){
  var dt=Math.min(.05,(now-reloj)/1000);reloj=now;tAcum+=dt;
  if(!bgListo){T=HORAS[horaActual];T.hazeC=hex(T.haze);dibujarCielo();dibujarTierra()}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(bgSky,0,0);
  aplicarVista(ctx);if(!reduce||true){dibujarNubes(ctx,reduce?0:tAcum)}
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bgLand,0,0);
  aplicarVista(ctx);
  dibujarAves(ctx,reduce?0:tAcum);
  dibujarTractor(ctx,tAcum);
  actualizarPersona(P.david,dt,tAcum,P.tecno);actualizarPersona(P.tecno,dt,tAcum,P.david);
  sombraSuelo(ctx,P.david);sombraSuelo(ctx,P.tecno);
  dibujarPersona(ctx,P.david,tAcum);dibujarPersona(ctx,P.tecno,tAcum);
  etiqueta(ctx,P.david,tAcum,P.david.hablando);etiqueta(ctx,P.tecno,tAcum,P.tecno.hablando);
  // gradación de color y viñeta
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.fillStyle=T.tinte;ctx.fillRect(0,0,view.w,view.h);
  var vg=ctx.createRadialGradient(view.w/2,view.h*.45,Math.min(view.w,view.h)*.35,view.w/2,view.h*.5,Math.max(view.w,view.h)*.8);
  vg.addColorStop(0,'rgba(20,10,0,0)');vg.addColorStop(1,'rgba(20,10,0,'+T.viñeta+')');ctx.fillStyle=vg;ctx.fillRect(0,0,view.w,view.h);
  requestAnimationFrame(bucle);
}

/* ================= Eventos ================= */
document.querySelectorAll('#horas button').forEach(function(b){
  b.addEventListener('click',function(){
    horaActual=b.getAttribute('data-h');
    document.querySelectorAll('#horas button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    bgListo=false;
  });
});
document.querySelectorAll('#horas button').forEach(function(x){x.setAttribute('aria-pressed',x.getAttribute('data-h')===horaActual?'true':'false')});
$('bDebate').addEventListener('click',function(){if(estado.modo==='debate'){terminarDebate(false)}else{iniciarDebate()}});
$('bDavid').addEventListener('click',function(){iniciarLive('david')});
$('bTecno').addEventListener('click',function(){iniciarLive('tecno')});
['vD','vT','vE'].forEach(function(id){$(id).addEventListener('click',function(){var m={vD:'David',vT:'Tecno',vE:'Empate'}[id];$('voto').hidden=true;setEstado('Tu voto: '+m+'. Gracias por participar.')})});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(function(){resize()}).observe($('panel'));
document.addEventListener('visibilitychange',function(){if(document.hidden&&estado.modo==='debate')terminarDebate(false)});

resize();
requestAnimationFrame(function(t){reloj=t;bucle(t)});
window.__escena={estado:estado,P:P,GUION:GUION,iniciarDebate:iniciarDebate,hora:function(h){horaActual=h;bgListo=false}};
})();
